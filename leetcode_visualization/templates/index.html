<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Balanced Binary Tree Visualizer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            color: #2c3e50;
            margin: 0;
            padding: 30px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #34495e;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input[type="number"] {
            width: 100%;
            padding: 14px;
            font-size: 17px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52,152,219,0.2);
        }
        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #2980b9;
        }
        .center {
            text-align: center;
        }
        .result {
            margin-top: 40px;
        }
        .info-box {
            background: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            font-size: 1.05em;
        }
        .error {
            color: #c0392b;
            background: #fdeded;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        img {
            max-width: 100%;
            border-radius: 10px;
            border: 1px solid #dfe6e9;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Balanced Binary Tree Visualizer</h1>

        <form method="post" action="/visualize" class="center">
            <div class="form-group">
                <label for="number">Enter a positive integer:</label>
                <input type="number" id="number" name="number" min="1" placeholder="e.g. 5, 10, 20" required />
            </div>
            <button type="submit">Generate Tree</button>
        </form>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        {% if input_number is not none %}
            <div class="info-box">
                Number entered: <strong>{{ input_number }}</strong><br>
                {% if generated_bits %}
                    Generated bit string: <strong>{{ generated_bits }}</strong>
                {% endif %}
            </div>
        {% endif %}

        {% if image_base64 %}
            <div class="result">
                <h2>Your Tree</h2>
                <img src="data:image/png;base64,{{ image_base64 }}" alt="Generated Binary Tree" />
            </div>
        {% endif %}
    </div>
</body>
</html>
